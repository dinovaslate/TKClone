<article class="venue-card">
  <div class="venue-media">
    <img src="{{ venue.image_url }}" alt="{{ venue.name }}" />
    <div class="venue-badge">{{ venue.category.name }}</div>
    <form
      method="post"
      action="{% url 'main:toggle_wishlist' venue.id %}"
      class="wishlist-form"
    >
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.get_full_path }}" />
      <button type="submit" class="wishlist-button {% if venue.id in wishlist_ids %}active{% endif %}" title="Toggle wishlist">
        <i class="fa-solid fa-heart"></i>
      </button>
    </form>
  </div>
  <div class="venue-body">
    <h3>{{ venue.name }}</h3>
    <p class="venue-location"><i class="fa-solid fa-location-dot"></i> {{ venue.city }}</p>
    <p class="venue-price">IDR {{ venue.price_per_hour|floatformat:0 }} / session</p>
    <div class="card-actions">
      <a href="{% url 'main:venue_detail' venue.slug %}" class="button secondary">View product</a>
    </div>
  </div>
</article>
